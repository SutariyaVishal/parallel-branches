name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.9"}   # setup-python has no 3.9 build for ubuntu-24.04
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.12"}
    env:
      # Chrome cannot create its sandbox on hosted runners.
      PB_CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skill and plugin manifests
        run: python3 tests/validate_skill.py
      - name: Unit and CLI tests
        run: python3 -W error::ResourceWarning -m unittest discover tests/scripts -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --line-length 120 --target-version py39 --select E,F,W --extend-exclude tests/fixtures .
      - run: shellcheck tests/phase0/probe-ports.sh
      - name: plugin/ matches skills/ and holds only files the directory accepts
        run: python3 tools/build_directory_plugin.py --check
      - name: The package builds
        run: pip install build && python -m build
