name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # macOS jobs sat queued until cancelled on this private repo (no steps ever ran), so they must not
    # block the run. They still report; re-enable by removing `experimental` once macOS runners work.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.9"}   # setup-python has no 3.9 build for ubuntu-24.04
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.9", experimental: true}
          - {os: macos-latest, python: "3.12", experimental: true}
    env:
      # Chrome cannot create its sandbox on hosted runners.
      PB_CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skill and plugin manifests
        run: python3 tests/validate_skill.py
      - name: Unit and CLI tests
        run: python3 -W error::ResourceWarning -m unittest discover tests/scripts -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: shellcheck tests/phase0/probe-ports.sh
