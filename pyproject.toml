[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-branches"
version = "0.14.0"
description = "Run several git branches side by side, each with its own worktree, dev server and port."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Vishal Sutariya"}]
keywords = ["git", "worktree", "dev-server", "parallel"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/SutariyaVishal/parallel-branches"
Issues = "https://github.com/SutariyaVishal/parallel-branches/issues"

[project.scripts]
pb = "pb:main"

[tool.setuptools]
py-modules = ["pb", "hooks", "procs", "stacks", "devbrowser"]

[tool.setuptools.package-dir]
"" = "skills/parallel-branches/scripts"
