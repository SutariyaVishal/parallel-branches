name: ci-macos

on:
  workflow_dispatch:   # run by hand: hosted macOS runners never picked up jobs on this private repo

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.12"}
    env:
      # Chrome cannot create its sandbox on hosted runners.
      PB_CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skill and plugin manifests
        run: python3 tests/validate_skill.py
      - name: Unit and CLI tests
        run: python3 -W error::ResourceWarning -m unittest discover tests/scripts -v
