name: runner-probe

# Manual. Finds out which hosted macOS and Windows runner labels actually start jobs on this repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest, macos-15-intel, windows-latest, windows-2022]
    steps:
      - run: echo "runner ok on ${{ matrix.os }}"
      - run: python --version || python3 --version
