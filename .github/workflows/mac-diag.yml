name: mac-diag

# Temporary: confirms why `python -m http.server` never answered on the macOS runner. Delete afterwards.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Time the suspects
        run: |
          python3 - <<'PY'
          import socket, time
          for host in ("127.0.0.1", "localhost"):
              t = time.time()
              name = socket.getfqdn(host)
              print("getfqdn(%s) -> %s took %.2fs" % (host, name, time.time() - t), flush=True)
          t = time.time()
          print("gethostname:", socket.gethostname(), "took %.2fs" % (time.time() - t), flush=True)
          PY
      - name: Old server versus the helper
        run: |
          python3 - <<'PY'
          import os, signal, socket, subprocess, sys, time
          def trial(label, args, port):
              t0 = time.time()
              p = subprocess.Popen(args, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)
              ok = None
              while time.time() - t0 < 45:
                  try:
                      socket.create_connection(("127.0.0.1", port), timeout=1).close()
                      ok = round(time.time() - t0, 2)
                      break
                  except OSError:
                      time.sleep(0.1)
              print("%-14s port %d connected after %s" % (label, port, ok), flush=True)
              os.killpg(p.pid, signal.SIGTERM)
              time.sleep(0.3)
          for n in range(3):
              trial("http.server", [sys.executable, "-m", "http.server", str(4700 + n), "--bind", "127.0.0.1"], 4700 + n)
          for n in range(3):
              trial("helper serve.py", [sys.executable, "tests/helpers/serve.py", str(4800 + n)], 4800 + n)
          PY
